try{setTheme(localStorage.getItem("jdash-theme")||"light")}catch(e){}
$("theme").onclick=()=>{const dark=root.classList.contains("dark")||(!root.classList.contains("light")&&!matchMedia("(prefers-color-scheme: light)").matches);setTheme(dark?"light":"dark")};

if(!D.length){$("emptyState").hidden=false;$("main").hidden=true;$("reset").hidden=true}else{

/* ---------- estado ---------- */
const F={q:"",st:new Set(),ats:new Set(),lt:new Set(),rt:"",d1:"",d2:"",grp:false,sk:"_date",sd:-1,page:0};
const open={};const PER=50;
function cnt(arr,f){const m={};for(const a of arr){const k=f(a);m[k]=(m[k]||0)+1}return m}
function sortedKeys(m,o){return Object.fromEntries(Object.entries(m).sort((a,b)=>o?(ord(o,a[0])-ord(o,b[0]))||a[0].localeCompare(b[0]):(b[1]-a[1])||a[0].localeCompare(b[0],"pt")))}
function shift(d,n){const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
const go=()=>{F.page=0;syncUI();render()};

/* ---------- resumo ---------- */
function renderSummary(){
  const sc=sortedKeys(cnt(D,a=>a.status),STORD);
  $("kpis").innerHTML=`<div class="kpi total" data-st="" title="Mostrar todas"><b>${D.length}</b><span>no total · ${D.filter(a=>a._applied).length} enviadas · ${D.filter(a=>a._active).length} ativas</span></div>`+
   Object.keys(sc).map(k=>`<div class="kpi" data-st="${esc(k)}" title="Filtrar por ${esc(sl(k))}"><b>${sc[k]}</b><span>${esc(sl(k))}</span></div>`).join("");
  $("kpis").onclick=e=>{const k=e.target.closest(".kpi[data-st]");if(!k)return;const v=k.dataset.st;F.st=(!v||(F.st.size===1&&F.st.has(v)))?new Set():new Set([v]);go();$("q").scrollIntoView({behavior:"smooth",block:"center"})};
  const days=[];for(let i=13;i>=0;i--)days.push(shift(META.today,-i));
  const pc=cnt(D.filter(a=>a._applied),a=>day(a._date));const vals=days.map(d=>pc[d]||0);const mx=Math.max(1,...vals);const tot=vals.reduce((x,y)=>x+y,0);
  $("c14").textContent=`· ${tot} nos últimos 14 dias`;
  const W=300,H=120,bw=W/14;let s=`<svg viewBox="0 0 ${W} ${H+18}" width="100%" role="img" aria-label="Candidaturas por dia nos últimos 14 dias">`;
  vals.forEach((v,i)=>{const h=v?Math.max(2,(H-14)*v/mx):0;const x=i*bw+2;s+=`<g data-day="${days[i]}" style="cursor:pointer"><rect x="${i*bw}" y="0" width="${bw}" height="${H+18}" fill="transparent"></rect><rect class="bar" x="${x}" y="${H-h}" width="${bw-4}" height="${h}" rx="2"><title>${fmtD(days[i])}: ${v}</title></rect>${v?`<text x="${x+(bw-4)/2}" y="${H-h-3}" text-anchor="middle">${v}</text>`:""}<text x="${x+(bw-4)/2}" y="${H+13}" text-anchor="middle">${days[i].slice(8,10)}</text></g>`});
  $("chart").innerHTML=s+`<line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--b)"></line></svg><div class="sub">Clique numa barra para filtrar o dia.</div>`;
  $("chart").onclick=e=>{const g=e.target.closest("g[data-day]");if(!g)return;const d=g.dataset.day;if(F.d1===d&&F.d2===d){F.d1=F.d2=""}else{F.d1=F.d2=d}go()};
  const lc=cnt(D,a=>a._lt);const ap=cnt(D.filter(a=>a._applied),a=>a._lt);const o=LTORD.filter(k=>lc[k]);
  $("split").innerHTML=`<div class="split">${o.map(k=>`<div style="width:${100*lc[k]/D.length}%;background:${LTC[k]}" title="${LTL[k]}: ${lc[k]}"></div>`).join("")}</div>
   <div class="legend">${o.map(k=>`<div data-lt="${k}"><span><span class="dot" style="background:${LTC[k]}"></span>${LTL[k]}</span><span><b>${lc[k]}</b> <span class="sub">(${ap[k]||0} enviadas · ${Math.round(100*lc[k]/D.length)}%)</span></span></div>`).join("")}</div>
   <div class="sub" style="margin-top:8px">“Florianópolis” = presencial/híbrido na região (Florianópolis, Floripa, SC). “Outro” inclui local não informado. Inferido do local e das notas.</div>`;
  $("split").onclick=e=>{const k=e.target.closest("[data-lt]");if(!k)return;const v=k.dataset.lt;F.lt=(F.lt.size===1&&F.lt.has(v))?new Set():new Set([v]);go()};
}

/* ---------- processos ativos ---------- */
function renderActive(){
  const A=D.filter(a=>a._active).sort((a,b)=>(ord(STORD,a.status)-ord(STORD,b.status))||String(b._lr||b._date).localeCompare(String(a._lr||a._date)));
  const col=s=>/interview|offer/.test(s)?"g":/assessment|screen/.test(s)?"y":"v";
  $("acount").textContent=`· ${A.length}`;
  $("acards").innerHTML=A.length?A.map(a=>{const lr=(a.responses||[]).slice(-1)[0];return `<div class="acard" style="border-left-color:var(--${col(a.status)})">
   <div class="row" style="justify-content:space-between"><span class="co">${esc(a.company)}</span>${badge(a.status)}</div>
   <div class="ti">${roleLink(a)}</div>
   ${lr?`<div class="sub"><b>Última resposta:</b> ${esc(rl(lr.type))} · ${esc(fmtD(lr.received_at))}${lr.subject?` — ${esc(lr.subject)}`:""}</div>`:""}
   <div class="st">${a._date?"Candidatura em "+esc(fmtD(a._date))+" · ":""}${esc(a._ats)} · ${esc(LTL[a._lt])}</div></div>`}).join(""):`<div class="empty">Nenhum processo ativo no momento.</div>`;
}

/* ---------- filtros ---------- */
function chips(el,map,set,labels){
  el.innerHTML=Object.keys(map).map(k=>`<span class="chip${set.has(k)?" on":""}" data-k="${esc(k)}">${esc(labels(k))}<small>${map[k]}</small></span>`).join("");
  el.onclick=e=>{const c=e.target.closest(".chip");if(!c)return;const k=c.dataset.k;set.has(k)?set.delete(k):set.add(k);go()};
}
function syncUI(){
  $("q").value=F.q;$("d1").value=F.d1;$("d2").value=F.d2;$("frt").value=F.rt;$("grp").checked=F.grp;
  chips($("fst"),sortedKeys(cnt(D,a=>a.status),STORD),F.st,sl);
  chips($("fats"),sortedKeys(cnt(D,a=>a._ats)),F.ats,k=>k);
  chips($("flt"),sortedKeys(cnt(D,a=>a._lt),LTORD),F.lt,k=>LTL[k]||k);
  document.querySelectorAll(".kpi[data-st]").forEach(k=>k.classList.toggle("on",F.st.size===1&&F.st.has(k.dataset.st)));
  document.querySelectorAll(".chip[data-days]").forEach(c=>{const n=+c.dataset.days;c.classList.toggle("on",F.d2===META.today&&F.d1===shift(META.today,1-n))});
}
{const rc=sortedKeys(cnt(D,a=>a._rt));$("frt").innerHTML+=Object.keys(rc).map(k=>`<option value="${esc(k)}">${esc(rl(k))} (${rc[k]})</option>`).join("");}
document.querySelectorAll(".chip[data-days]").forEach(c=>c.onclick=()=>{const n=+c.dataset.days;if(c.classList.contains("on")){F.d1=F.d2=""}else{F.d2=META.today;F.d1=shift(META.today,1-n)}go()});
let qt;$("q").oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{F.q=e.target.value;F.page=0;render()},60)};
$("d1").onchange=e=>{F.d1=e.target.value;go()};$("d2").onchange=e=>{F.d2=e.target.value;go()};
$("frt").onchange=e=>{F.rt=e.target.value;F.page=0;render()};
$("grp").onchange=e=>{F.grp=e.target.checked;F.page=0;render()};
$("reset").onclick=()=>{Object.assign(F,{q:"",st:new Set(),ats:new Set(),lt:new Set(),rt:"",d1:"",d2:"",grp:false,sk:"_date",sd:-1,page:0});syncUI();render()};
document.addEventListener("keydown",e=>{if(e.key==="/"&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$("q").focus()}});

function filtered(){
  const terms=F.q.toLowerCase().split(/\s+/).filter(Boolean);
  return D.filter(a=>(!F.st.size||F.st.has(a.status))&&(!F.ats.size||F.ats.has(a._ats))&&(!F.lt.size||F.lt.has(a._lt))&&(!F.rt||a._rt===F.rt)
   &&(!F.d1||(day(a._date)&&day(a._date)>=F.d1))&&(!F.d2||(day(a._date)&&day(a._date)<=F.d2))&&terms.every(t=>a._hay.includes(t)));
}
const COLS=[["_date","Data",1],["company","Empresa / cargo",1],["_lt","Local",1,"hide-m"],["_ats","ATS",1,"hide-m"],["status","Status",1],["_rt","Resposta",1,"hide-m"],["url","Vaga",0]];
const GCOLS=[["company","Empresa",1],["n","Total",1],["act","Ativos",1],["rej","Não aprovadas",1],["last","Última",1]];
function cmp(a,b,k){const x=a[k]??"",y=b[k]??"";if(typeof x==="number"&&typeof y==="number")return x-y;if(k==="_date"||k==="last"){if(!x&&y)return -1;if(x&&!y)return 1}return String(x).localeCompare(String(y),"pt",{sensitivity:"base"})}
function head(cols){$("th").innerHTML="<tr>"+cols.map(([k,l,s,c])=>`<th class="${s?"s ":""}${c||""}" data-k="${k}">${l}${F.sk===k?`<span class="ar">${F.sd>0?"▲":"▼"}</span>`:""}</th>`).join("")+"</tr>"}
$("th").onclick=e=>{const t=e.target.closest("th.s");if(!t)return;const k=t.dataset.k;if(F.sk===k)F.sd=-F.sd;else{F.sk=k;F.sd=["_date","n","last","act","rej"].includes(k)?-1:1}F.page=0;render()};
function pager(total,nrec){
  const pages=Math.max(1,Math.ceil(total/PER));F.page=Math.min(F.page,pages-1);const from=total?F.page*PER+1:0,to=Math.min(total,(F.page+1)*PER);
  const txt=nrec!=null?`${from}–${to} de ${total} empresas · ${nrec} candidaturas${nrec!==D.length?` (filtrado de ${D.length})`:""}`:`${from}–${to} de ${total}${total!==D.length?` (filtrado de ${D.length})`:""}`;
  const ctl=pages>1?`<button class="btn" data-p="0" ${F.page?"":"disabled"}>«</button><button class="btn" data-p="${F.page-1}" ${F.page?"":"disabled"}>‹ Anterior</button><span class="count">Página ${F.page+1} de ${pages}</span><button class="btn" data-p="${F.page+1}" ${F.page<pages-1?"":"disabled"}>Próxima ›</button><button class="btn" data-p="${pages-1}" ${F.page<pages-1?"":"disabled"}>»</button>`:"";
  for(const [c,p] of [["cnt","pg1"],["cnt2","pg2"]]){$(c).textContent=txt;$(p).innerHTML=ctl}
}
document.querySelectorAll("#pg1,#pg2").forEach(el=>el.onclick=e=>{const b=e.target.closest("button[data-p]");if(!b||b.disabled)return;F.page=+b.dataset.p;render();if(el.id==="pg2")$("cnt").scrollIntoView({block:"start"})});
function detail(a){
  const qa=a.qa||[],rs=a.responses||[];
  return `<tr class="det"><td colspan="7"><div class="w"><div>
   <div class="meta"><b>Cargo:</b> ${esc(a.role||"—")}</div>
   <div class="meta"><b>ATS:</b> ${esc(a.ats||a._ats)}${isUrl(a.url)?` · <a href="${esc(a.url)}" target="_blank" rel="noopener">Abrir vaga ↗</a>`:""}</div>
   <div class="meta"><b>Local:</b> <span class="lt">${esc(LTL[a._lt])}</span></div>
   <div class="meta"><b>Data:</b> ${esc(fmtD(a._date))}${a._dguess?" (estimada pelo nome do arquivo)":""}</div></div>
   <div><div class="meta"><b>Respostas da empresa${rs.length?` (${rs.length})`:""}</b></div>${rs.length?`<div class="tl">${rs.map(r=>`<div>${rbadge(r.type)} <span class="sub">${esc(fmtD(r.received_at))}${r.from?" · "+esc(r.from):""}</span>${r.subject?`<br><b>${esc(r.subject)}</b>`:""}${r.summary?`<div class="meta">${esc(r.summary)}</div>`:""}</div>`).join("")}</div>`:`<div class="meta">Nenhuma resposta ainda</div>`}</div>
   </div></td></tr>`;
}
function render(){
  const r=filtered();let h="";
  if(F.grp){
    const g={};for(const a of r){const k=a.company||"—";const o=g[k]||(g[k]={company:k,n:0,act:0,rej:0,last:""});o.n++;if(a._active)o.act++;if(a.status==="rejected"||a._rt==="rejection")o.rej++;if(String(a._date)>o.last)o.last=String(a._date)}
    let rows=Object.values(g);if(!GCOLS.some(c=>c[0]===F.sk)){F.sk="n";F.sd=-1}rows.sort((a,b)=>cmp(a,b,F.sk)*F.sd||cmp(a,b,"company"));
    head(GCOLS);pager(rows.length,r.length);
    for(const o of rows.slice(F.page*PER,(F.page+1)*PER))h+=`<tr class="r grp" data-co="${esc(o.company)}"><td>${esc(o.company)}</td><td>${o.n}</td><td>${o.act||""}</td><td>${o.rej||""}</td><td class="d">${esc(fmtD(o.last).slice(0,10))}</td></tr>`;
    $("tb").innerHTML=h||`<tr><td colspan="5" class="empty">Nada encontrado.</td></tr>`;return;
  }
  if(!COLS.some(c=>c[0]===F.sk&&c[2])){F.sk="_date";F.sd=-1}
  r.sort((a,b)=>cmp(a,b,F.sk)*F.sd||cmp(b,a,"_date"));head(COLS);pager(r.length);
  for(const a of r.slice(F.page*PER,(F.page+1)*PER)){
    h+=`<tr class="r" data-id="${esc(a._id)}" title="Clique para ver detalhes"><td class="d">${esc(fmtD(a._date))}${a._dguess?"*":""}</td><td><b>${esc(a.company)}</b><div class="ti">${esc(a.role||"—")}</div></td>
    <td class="hide-m"><span class="lt">${esc(LTL[a._lt])}</span> <span class="ti">${esc(a.location)}</span></td><td class="hide-m">${esc(a._ats)}</td><td>${badge(a.status)}</td><td class="hide-m">${rbadge(a._rt,a._rs)}</td>
    <td>${isUrl(a.url)?`<a href="${esc(a.url)}" target="_blank" rel="noopener" title="${esc(a.url)}">Abrir ↗</a>`:""}</td></tr>`;
    if(open[a._id])h+=detail(a);
  }
  $("tb").innerHTML=h||`<tr><td colspan="7" class="empty">Nada encontrado com esses filtros.</td></tr>`;
}
$("tb").onclick=e=>{if(e.target.closest("a,summary,details,.det"))return;const g=e.target.closest("tr.grp");if(g){F.grp=false;F.q=g.dataset.co;F.page=0;F.sk="_date";F.sd=-1;syncUI();render();return}const t=e.target.closest("tr.r");if(t){open[t.dataset.id]=!open[t.dataset.id];render()}};
renderSummary();renderActive();syncUI();render();
}
</script></body></html>
